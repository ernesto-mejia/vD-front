<div>
  <div>
    <app-sidebar></app-sidebar>
  </div>
  <div class="p-5">
    <div class="container-fluid">
      <!-- Loading State -->
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3">Procesando información...</p>
      </div>

      <!-- Form Card -->
      <div *ngIf="!loading" class="row">
        <div class="col-lg-10 offset-lg-1">
          <div class="card border-0 shadow-sm">
            <!-- Header -->
            <div class="card-header bg-success text-white py-3">
              <h3 class="mb-0">
                <i class="fas fa-plus-circle me-2"></i>Crear Nuevo Permiso
              </h3>
            </div>

            <!-- Form Body -->
            <div class="card-body">
              <form (ngSubmit)="onSubmit()">
                <div class="row g-4">
                  <!-- Nombre del Permiso -->
                  <div class="col-lg-6">
                    <label for="name" class="form-label text-muted small text-uppercase fw-bold">
                      <i class="fas fa-tag me-2 text-success"></i>Nombre del Permiso *
                    </label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="name"
                      [(ngModel)]="permission.name"
                      name="name"
                      placeholder="Ej: crear usuarios, editar roles"
                      required
                      [disabled]="loading"
                    />
                  </div>

                  <!-- Guard Name -->
                  <div class="col-lg-6">
                    <label for="guard_name" class="form-label text-muted small text-uppercase fw-bold">
                      <i class="fas fa-shield-alt me-2 text-info"></i>Guard Name
                    </label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="guard_name"
                      [(ngModel)]="permission.guard_name"
                      name="guard_name"
                      placeholder="Ej: api, web"
                      [disabled]="loading"
                    />
                  </div>
                </div>

                <!-- Info Box -->
                <div class="alert alert-light border-2 border-success-subtle mt-4">
                  <h6 class="alert-heading mb-2">
                    <i class="fas fa-info-circle me-2 text-success"></i>Información
                  </h6>
                  <p class="mb-0 small text-muted">
                    Los permisos se utilizan para controlar el acceso a funcionalidades específicas del sistema.
                    Cada permiso se puede asignar a uno o varios roles.
                  </p>
                </div>
              </form>
            </div>

            <!-- Footer with Actions -->
            <div class="card-footer d-flex justify-content-between align-items-center">
              <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="loading">
                <i class="fas fa-times me-2"></i>Cancelar
              </button>
              <button type="submit" class="btn btn-success" [disabled]="loading" (click)="onSubmit()">
                <i class="fas fa-save me-2" *ngIf="!loading"></i>
                <i class="fas fa-spinner fa-spin me-2" *ngIf="loading"></i>
                {{ loading ? 'Creando...' : 'Crear Permiso' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
