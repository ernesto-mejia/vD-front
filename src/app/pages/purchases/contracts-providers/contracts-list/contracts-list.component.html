<div>
  <app-sidebar></app-sidebar>
</div>

<main id="content" class="container-fluid">
  <div class="row">
    <div class="col-12">
      <!-- Filtros -->
      <section class="card mb-3">
        <header class="card-header">
          <h5 class="card-title mb-0">
            <i class="fas fa-filter me-2"></i>Filtros
          </h5>
        </header>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Proveedor</label>
              <select class="form-select" [(ngModel)]="filters.provider_id" name="providerFilter">
                <option [ngValue]="undefined">Todos los proveedores</option>
                <option *ngFor="let prov of providers" [ngValue]="prov.id">{{ prov.shortname }}</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Relación con Cliente</label>
              <select class="form-select" [(ngModel)]="hasClientContractFilter" name="clientRelationFilter">
                <option value="">Todos</option>
                <option value="yes">Con contrato cliente</option>
                <option value="no">Sin contrato cliente</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Buscar</label>
              <input type="text" class="form-control" [(ngModel)]="filters.search" placeholder="Nombre del contrato...">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary me-2" (click)="applyFilters()">
                <i class="fas fa-search me-1"></i>Buscar
              </button>
              <button class="btn btn-secondary" (click)="clearFilters()">
                <i class="fas fa-times me-1"></i>Limpiar
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Tabla de contratos -->
      <section class="card">
        <header class="card-header bg-secondary text-white">
          <h3 class="card-title mb-0">
            <i class="fas fa-truck me-2"></i>Contratos de Proveedores
          </h3>
        </header>
        <div class="card-body">
          <div class="table-responsive">
            <table id="providerContractsTable" class="table table-striped table-bordered table-hover w-100" aria-label="Lista de contratos de proveedores">
              <!-- Tabla renderizada dinámicamente -->
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
