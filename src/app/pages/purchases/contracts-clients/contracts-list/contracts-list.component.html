<div>
  <app-sidebar></app-sidebar>
</div>

<main id="content" class="container-fluid">
  <div class="row">
    <div class="col-12">
      <!-- Filtros -->
      <section class="card mb-3">
        <header class="card-header">
          <h5 class="card-title mb-0">
            <i class="fas fa-filter me-2"></i>Filtros
          </h5>
        </header>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Región</label>
              <select class="form-select" [(ngModel)]="filters.region_id" name="regionFilter">
                <option [ngValue]="undefined">Todas las regiones</option>
                <option *ngFor="let region of regions" [ngValue]="region.id">{{ region.name }}</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha desde</label>
              <input type="date" class="form-control" [(ngModel)]="filters.start_date_from" name="dateFrom">
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha hasta</label>
              <input type="date" class="form-control" [(ngModel)]="filters.start_date_to" name="dateTo">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary me-2" (click)="applyFilters()">
                <i class="fas fa-search me-1"></i>Buscar
              </button>
              <button class="btn btn-secondary" (click)="clearFilters()">
                <i class="fas fa-times me-1"></i>Limpiar
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Tabla de contratos -->
      <section class="card">
        <header class="card-header bg-secondary text-white">
          <h3 class="card-title mb-0">
            <i class="fas fa-file-contract me-2"></i>Contratos de Clientes
          </h3>
        </header>
        <div class="card-body">
          <div class="table-responsive">
            <table id="contractsTable" class="table table-striped table-bordered table-hover w-100" aria-label="Lista de contratos de clientes">
              <!-- Tabla renderizada dinámicamente -->
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
