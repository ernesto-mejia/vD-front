<div >
  <div>
    <app-sidebar></app-sidebar>
  </div>
  <div class="p-5">
    <div class="container mt-4">
      <h2>Crear Nueva Prueba</h2>
      <form (ngSubmit)="onSubmit()" #testForm="ngForm" class="w-100 p-3">
        <div class="row mb-3 w-100 d-flex">
          <div class="form-group col-md-6 mb-2">
            <label for="nombrePrueba">Nombre de la Prueba</label>
            <input type="text" class="form-control" id="nombrePrueba" required [(ngModel)]="test.nombrePrueba" name="nombrePrueba">
          </div>
          <div class="form-group col-md-6 mb-2">
            <label for="claveEstudio">Clave del Estudio</label>
            <input type="text" class="form-control" id="claveEstudio" required [(ngModel)]="test.claveEstudio" name="claveEstudio">
          </div>
          <div class="form-group col-md-6 mb-2">
            <label for="claveSat">Clave SAT</label>
            <input type="text" class="form-control" id="claveSat" required [(ngModel)]="test.claveSat" name="claveSat">
          </div>
          <div class="form-group col-md-6 mb-2">
            <label for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" required [(ngModel)]="test.descripcion" name="descripcion"></textarea>
          </div>
          <div class="form-group col-md-6 mb-2">
            <label for="claveInterna">Clave Interna</label>
            <input type="text" class="form-control" id="claveInterna" required [(ngModel)]="test.claveInterna" name="claveInterna">
          </div>
        </div>

        <!-- Selección de Equipos -->
        <div class="form-group col-md-6 mb-2">
          <label for="equipos">¿Esta prueba usa alguna máquina?</label>
          <select class="form-select" id="equipos" multiple [(ngModel)]="test.equipos" name="equipos">
            <option *ngFor="let equipo of equipos" [value]="equipo">{{ equipo.nombre }}</option>
          </select>
        </div>

        <!-- Botón para agregar reactivos -->
        <div class="form-group col-md-6 mb-2">
          <button type="button" class="btn btn-primary" (click)="openReactivosModal()">Agregar Reactivos</button>
        </div>

        <!-- Selección de Kits -->
        <div class="form-group col-md-6 mb-2">
          <label for="kits">Seleccionar Kit</label>
          <select class="form-select" id="kits" [(ngModel)]="test.kit" name="kit" (change)="onKitChange()">
            <option *ngFor="let kit of kits" [value]="kit">{{ kit.nombre }}</option>
          </select>
        </div>

        <!-- Información del Kit seleccionado -->
        <div *ngIf="selectedKit" class="form-group col-md-12 mb-2">
          <h5>Información del Kit Seleccionado</h5>
          <p>{{ selectedKit.descripcion }}</p>
          <ul>
            <li *ngFor="let item of selectedKit.items">{{ item }}</li>
          </ul>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" class="btn btn-secondary" (click)="goBack()">Cancelar</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal para agregar reactivos -->
<div class="modal fade" id="reactivosModal" tabindex="-1" role="dialog" aria-labelledby="reactivosModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reactivosModalLabel">Agregar Reactivos</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="reactivos">Seleccionar Reactivos</label>
          <select class="form-select" id="reactivos" multiple [(ngModel)]="selectedReactivos" name="reactivos">
            <option *ngFor="let reactivo of reactivos" [value]="reactivo">{{ reactivo.nombre }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cantidad">Cantidad</label>
          <input type="number" class="form-control" id="cantidad" [(ngModel)]="reactivoCantidad" name="cantidad">
        </div>
        <button type="button" class="btn btn-primary" (click)="addReactivo()">Agregar</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
