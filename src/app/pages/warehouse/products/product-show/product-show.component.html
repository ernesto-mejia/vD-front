<div>
  <!-- Sidebar -->
  <div class="pb-3">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Contenido principal -->
  <div class="p-5 p-sm-5" lang="es">
    <div class="container">
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0">
            Detalle del Producto - {{ product?.name || "-" }} (SKU:
            {{ product?.sku || "-" }})
          </h5>
          <div class="btn-group" role="group">
            <button
              class="btn btn-primary me-2"
              (click)="goToEdit()"
              title="Editar"
            >
              <i class="fas fa-edit me-1"></i>Editar
            </button>
            <button
              class="btn btn-secondary me-2 btn-outline-light"
              (click)="goBack()"
              title="Regresar"
            >
              <i class="fas fa-arrow-left me-1"></i>Regresar
            </button>
          </div>
        </div>
        <div class="card-body">
          <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="tab-info"
                data-bs-toggle="tab"
                data-bs-target="#pane-info"
                type="button"
                role="tab"
                aria-controls="pane-info"
                aria-selected="true"
              >
                <i class="fas fa-info-circle me-1"></i> Información general
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-providers"
                data-bs-toggle="tab"
                data-bs-target="#pane-providers"
                type="button"
                role="tab"
                aria-controls="pane-providers"
                aria-selected="false"
              >
                <i class="fas fa-truck me-1"></i> Proveedores
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-dimensions"
                data-bs-toggle="tab"
                data-bs-target="#pane-dimensions"
                type="button"
                role="tab"
                aria-controls="pane-dimensions"
                aria-selected="false"
              >
                <i class="fas fa-ruler-combined me-1"></i> Dimensiones y peso
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-equipments"
                data-bs-toggle="tab"
                data-bs-target="#pane-equipments"
                type="button"
                role="tab"
                aria-controls="pane-equipments"
                aria-selected="false"
              >
                <i class="fas fa-toolbox me-1"></i> Equipos
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-remplazos"
                data-bs-toggle="tab"
                data-bs-target="#pane-remplazos"
                type="button"
                role="tab"
                aria-controls="pane-remplazos"
                aria-selected="false"
              >
                <i class="fas fa-exchange-alt me-1"></i> Reemplazos
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-equivalencias"
                data-bs-toggle="tab"
                data-bs-target="#pane-equivalencias"
                type="button"
                role="tab"
                aria-controls="pane-equivalencias"
                aria-selected="false"
              >
                <i class="fas fa-random me-1"></i> Equivalencias
              </button>
            </li>
            <li
              class="nav-item"
              role="presentation"
              *ngIf="product?.configuration?.relates_to_other_products"
            >
              <button
                class="nav-link"
                id="tab-related-products"
                data-bs-toggle="tab"
                data-bs-target="#pane-related-products"
                type="button"
                role="tab"
                aria-controls="pane-related-products"
                aria-selected="false"
              >
                <i class="fas fa-link me-1"></i> Productos relacionados
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="tab-config"
                data-bs-toggle="tab"
                data-bs-target="#pane-config"
                type="button"
                role="tab"
                aria-controls="pane-config"
                aria-selected="false"
              >
                <i class="fas fa-sliders-h me-1"></i> Configuración
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Información general -->
            <div
              class="tab-pane fade show active"
              id="pane-info"
              role="tabpanel"
              aria-labelledby="tab-info"
            >
              <app-product-show-general
                [product]="product"
              ></app-product-show-general>
            </div>

            <div
              class="tab-pane fade"
              id="pane-dimensions"
              role="tabpanel"
              aria-labelledby="tab-dimensions"
            >
              <app-product-show-dimensions
                [product]="product"
              ></app-product-show-dimensions>
            </div>

            <div
              class="tab-pane fade"
              id="pane-equipments"
              role="tabpanel"
              aria-labelledby="tab-equipments"
            >
              <app-product-show-equipments
                [product]="product"
              ></app-product-show-equipments>
            </div>

            <div
              class="tab-pane fade"
              id="pane-remplazos"
              role="tabpanel"
              aria-labelledby="tab-remplazos"
            >
              <app-product-show-remplazos
                [product]="product"
              ></app-product-show-remplazos>
            </div>

            <div
              class="tab-pane fade"
              id="pane-equivalencias"
              role="tabpanel"
              aria-labelledby="tab-equivalencias"
            >
              <app-product-show-equivalencias
                [product]="product"
              ></app-product-show-equivalencias>
            </div>
            <div
              class="tab-pane fade"
              id="pane-related-products"
              role="tabpanel"
              aria-labelledby="tab-related-products"
              *ngIf="product?.configuration?.relates_to_other_products"
            >
              <app-product-show-related-products
                [product]="product"
              ></app-product-show-related-products>
            </div>

            <!-- Proveedores relacionados -->
            <div
              class="tab-pane fade"
              id="pane-providers"
              role="tabpanel"
              aria-labelledby="tab-providers"
            >
              <app-product-show-providers
                [product]="product"
                [providersCatalog]="providersCatalog"
                (addProviderRequested)="startAddProvider()"
              ></app-product-show-providers>
            </div>

            <div
              class="tab-pane fade"
              id="pane-config"
              role="tabpanel"
              aria-labelledby="tab-config"
            >
              <app-product-show-configuration
                [product]="product"
              ></app-product-show-configuration>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
