<div *ngIf="product?.related_products?.length; else noRelatedProducts">
  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle mt-2">
      <thead class="table-light">
        <tr>
          <th>Producto</th>
          <th>SKU</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rel of product.related_products">
          <td>{{ rel.name || rel.sku || (rel.id ?? "-") }}</td>
          <td>{{ rel.sku || "-" }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #noRelatedProducts>
  <p class="text-muted mb-0">No hay productos relacionados para este producto.</p>
</ng-template>
