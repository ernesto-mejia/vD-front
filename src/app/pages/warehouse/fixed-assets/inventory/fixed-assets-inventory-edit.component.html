<div class="pb-3">
  <app-sidebar></app-sidebar>
</div>

<main class="container-fluid p-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="flex-grow-1">
              <h5 class="mb-0">
                <i class="fas fa-warehouse me-2"></i>Editar Activo Fijo (Inventario)
              </h5>
            </div>
            <div class="btn-group" role="group">
              <button class="btn btn-outline-light btn-sm" (click)="goBack()">
                <i class="fas fa-arrow-left me-1"></i>Regresar
              </button>
              <button class="btn btn-warning btn-sm" (click)="updateInventory()" [disabled]="loading">
                <i class="fas fa-save me-1"></i>Guardar Cambios
              </button>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="epica-form-section">
            <h6 class="epica-form-section-title">
              <i class="fas fa-info-circle me-2"></i>Informacion del Activo
            </h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="internalCode" class="form-label">
                  <span class="required-asterisk">*</span>Num interno del sistema
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="internalCode"
                  [(ngModel)]="item.internal_code"
                  name="internalCode"
                  [class.is-invalid]="submitted && !item.internal_code"
                />
                <div *ngIf="submitted && !item.internal_code" class="invalid-feedback">
                  El numero interno es requerido
                </div>
              </div>

              <div class="col-md-6">
                <label for="inventoryName" class="form-label">
                  <span class="required-asterisk">*</span>Nombre
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="inventoryName"
                  [(ngModel)]="item.name"
                  name="inventoryName"
                  [class.is-invalid]="submitted && !item.name"
                />
                <div *ngIf="submitted && !item.name" class="invalid-feedback">
                  El nombre es requerido
                </div>
              </div>

              <div class="col-md-6">
                <label for="inventoryLocation" class="form-label">
                  <span class="required-asterisk">*</span>Ubicacion
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="inventoryLocation"
                  [(ngModel)]="item.location"
                  name="inventoryLocation"
                  [class.is-invalid]="submitted && !item.location"
                />
                <div *ngIf="submitted && !item.location" class="invalid-feedback">
                  La ubicacion es requerida
                </div>
              </div>

              <div class="col-md-6">
                <label for="inventoryCategory" class="form-label">
                  <span class="required-asterisk">*</span>Categoria
                </label>
                <select
                  class="form-select"
                  id="inventoryCategory"
                  [(ngModel)]="item.category"
                  name="inventoryCategory"
                  [class.is-invalid]="submitted && !item.category"
                >
                  <option value="">Selecciona una categoria...</option>
                  <option *ngFor="let category of categories" [value]="category">
                    {{ category }}
                  </option>
                </select>
                <div *ngIf="submitted && !item.category" class="invalid-feedback">
                  La categoria es requerida
                </div>
              </div>

              <div class="col-md-6">
                <label for="inventoryCatalog" class="form-label">Catalogo</label>
                <select
                  class="form-select"
                  id="inventoryCatalog"
                  [(ngModel)]="item.catalog_id"
                  name="inventoryCatalog"
                >
                  <option [ngValue]="undefined">Selecciona un catalogo...</option>
                  <option *ngFor="let catalog of catalogItems" [ngValue]="catalog.id">
                    {{ catalog.name }}
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="serialNumber" class="form-label">No. de serie</label>
                <input
                  type="text"
                  class="form-control"
                  id="serialNumber"
                  [(ngModel)]="item.serial_number"
                  name="serialNumber"
                />
              </div>

              <div class="col-12">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <label class="form-label mb-0">Accesorios</label>
                  <button type="button" class="btn btn-outline-primary btn-sm" (click)="addAccessory()">
                    <i class="fas fa-plus me-1"></i>Agregar
                  </button>
                </div>
                <div class="table-responsive mt-2" *ngIf="item.accessories?.length">
                  <table class="table table-sm table-striped align-middle">
                    <thead>
                      <tr>
                        <th>Descripcion</th>
                        <th style="width: 160px">Cantidad</th>
                        <th style="width: 80px"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let accessory of item.accessories; let i = index">
                        <td>
                          <input
                            class="form-control"
                            [(ngModel)]="accessory.description"
                            [name]="'accessory_desc_' + i"
                            type="text"
                          />
                        </td>
                        <td>
                          <input
                            class="form-control"
                            [(ngModel)]="accessory.quantity"
                            [name]="'accessory_qty_' + i"
                            type="number"
                            min="0"
                          />
                        </td>
                        <td class="text-end">
                          <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeAccessory(i)">
                            <i class="fas fa-trash"></i>
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <p class="text-muted mb-0" *ngIf="!item.accessories?.length">
                  Sin accesorios registrados.
                </p>
              </div>

              <div class="col-12">
                <label class="form-label d-block">Tipo de registro</label>
                <div class="form-check form-check-inline mt-2">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="ownershipComodato"
                    [checked]="item.ownership_type === 'comodato'"
                    (change)="onOwnershipChange('comodato')"
                  />
                  <label class="form-check-label" for="ownershipComodato">Comodato</label>
                </div>
                <div class="form-check form-check-inline mt-2">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="ownershipOwned"
                    [checked]="item.ownership_type === 'owned'"
                    (change)="onOwnershipChange('owned')"
                  />
                  <label class="form-check-label" for="ownershipOwned">Activo propio</label>
                </div>
              </div>

              <div class="col-12">
                <div class="form-check mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="maintenanceRequired"
                    [(ngModel)]="item.maintenance_required"
                    name="maintenanceRequired"
                    (change)="onMaintenanceRequiredChange()"
                  />
                  <label class="form-check-label" for="maintenanceRequired">Requiere mantenimiento</label>
                </div>
              </div>

              <div class="col-12" *ngIf="item.maintenance_required">
                <div class="row g-3 mt-1">
                  <div class="col-12">
                    <label class="form-label d-block">Tipo de mantenimiento</label>
                    <div class="form-check form-check-inline mt-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="maintenancePreventive"
                        [(ngModel)]="item.maintenance_type"
                        name="maintenanceType"
                        value="preventive"
                      />
                      <label class="form-check-label" for="maintenancePreventive">Mantenimiento preventivo</label>
                    </div>
                    <div class="form-check form-check-inline mt-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="maintenanceCorrective"
                        [(ngModel)]="item.maintenance_type"
                        name="maintenanceType"
                        value="corrective"
                      />
                      <label class="form-check-label" for="maintenanceCorrective">Mantenimiento correctivo</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label for="maintenanceDateFrom" class="form-label">Fecha (desde)</label>
                    <input
                      type="date"
                      class="form-control"
                      id="maintenanceDateFrom"
                      [(ngModel)]="item.maintenance_date_from"
                      name="maintenanceDateFrom"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="maintenanceDateUntil" class="form-label">Fecha (hasta)</label>
                    <input
                      type="date"
                      class="form-control"
                      id="maintenanceDateUntil"
                      [(ngModel)]="item.maintenance_date_until"
                      name="maintenanceDateUntil"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="maintenanceDescription" class="form-label">Descripcion del servicio</label>
                    <input
                      type="text"
                      class="form-control"
                      id="maintenanceDescription"
                      [(ngModel)]="item.maintenance_description"
                      name="maintenanceDescription"
                    />
                  </div>
                  <div class="col-12">
                    <label for="maintenanceObservations" class="form-label">Observaciones</label>
                    <textarea
                      class="form-control"
                      id="maintenanceObservations"
                      rows="3"
                      [(ngModel)]="item.maintenance_observations"
                      name="maintenanceObservations"
                    ></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="epica-form-section" *ngIf="item.ownership_type === 'comodato'">
            <h6 class="epica-form-section-title">
              <i class="fas fa-handshake me-2"></i>Datos de comodato
            </h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="comodatoValidFrom" class="form-label">Fecha de vigencia (desde)</label>
                <input
                  type="date"
                  class="form-control"
                  id="comodatoValidFrom"
                  [(ngModel)]="item.comodato_valid_from"
                  name="comodatoValidFrom"
                />
              </div>
              <div class="col-md-6">
                <label for="comodatoValidUntil" class="form-label">Fecha de vigencia (hasta)</label>
                <input
                  type="date"
                  class="form-control"
                  id="comodatoValidUntil"
                  [(ngModel)]="item.comodato_valid_until"
                  name="comodatoValidUntil"
                />
              </div>
              <div class="col-md-6">
                <label for="comodatoOwner" class="form-label">Propietario</label>
                <input
                  type="text"
                  class="form-control"
                  id="comodatoOwner"
                  [(ngModel)]="item.comodato_owner"
                  name="comodatoOwner"
                />
              </div>
              <div class="col-md-6">
                <label for="comodatoProvider" class="form-label">Proveedor</label>
                <select
                  class="form-select"
                  id="comodatoProvider"
                  [(ngModel)]="item.comodato_provider_id"
                  name="comodatoProvider"
                >
                  <option [ngValue]="undefined">Selecciona un proveedor...</option>
                  <option *ngFor="let provider of providers" [ngValue]="provider.id">
                    {{ provider.name }}
                  </option>
                </select>
              </div>
              <div class="col-12">
                <label for="comodatoObservations" class="form-label">Observaciones</label>
                <textarea
                  class="form-control"
                  id="comodatoObservations"
                  rows="3"
                  [(ngModel)]="item.comodato_observations"
                  name="comodatoObservations"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="epica-form-section" *ngIf="item.ownership_type === 'owned'">
            <h6 class="epica-form-section-title">
              <i class="fas fa-clipboard-list me-2"></i>Datos de activo propio
            </h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="plateId" class="form-label">Placa de identificacion</label>
                <input
                  type="text"
                  class="form-control"
                  id="plateId"
                  [(ngModel)]="item.plate_id"
                  name="plateId"
                />
              </div>
              <div class="col-md-6">
                <label for="acquisitionDate" class="form-label">Fecha de adquisicion</label>
                <input
                  type="date"
                  class="form-control"
                  id="acquisitionDate"
                  [(ngModel)]="item.acquisition_date"
                  name="acquisitionDate"
                />
              </div>
              <div class="col-md-6">
                <label for="acquisitionValue" class="form-label">Valor de adquisicion</label>
                <input
                  type="number"
                  class="form-control"
                  id="acquisitionValue"
                  [(ngModel)]="item.acquisition_value"
                  name="acquisitionValue"
                />
              </div>
              <div class="col-12">
                <label for="ownedObservations" class="form-label">Observaciones</label>
                <textarea
                  class="form-control"
                  id="ownedObservations"
                  rows="3"
                  [(ngModel)]="item.owned_observations"
                  name="ownedObservations"
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
