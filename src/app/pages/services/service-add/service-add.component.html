<div class="pb-3">
  <app-sidebar></app-sidebar>
</div>

<main class="container-fluid p-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="flex-grow-1">
              <h5 class="mb-0">
                <i class="fas fa-cogs me-2"></i>Nuevo Servicio
              </h5>
            </div>
            <div class="btn-group" role="group">
              <button class="btn btn-outline-light btn-sm" (click)="goBack()">
                <i class="fas fa-arrow-left me-1"></i>Regresar
              </button>
              <button class="btn btn-warning btn-sm" (click)="saveService()" [disabled]="loading">
                <i class="fas fa-save me-1"></i>Guardar
              </button>
            </div>
          </div>
        </div>

        <div class="card-body">
          <!-- Formulario del servicio -->
          <div class="epica-form-section">
            <h6 class="epica-form-section-title">
              <i class="fas fa-info-circle me-2"></i>Información del Servicio
            </h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="serviceName" class="form-label">
                  <span class="required-asterisk">*</span>Nombre
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="serviceName"
                  [(ngModel)]="service.name"
                  name="serviceName"
                  [class.is-invalid]="submitted && !service.name"
                />
                <div *ngIf="submitted && !service.name" class="invalid-feedback">
                  El nombre es requerido
                </div>
              </div>

              <div class="col-md-6">
                <label for="serviceCode" class="form-label">Clave</label>
                <input
                  type="text"
                  class="form-control"
                  id="serviceCode"
                  [(ngModel)]="service.code"
                  name="serviceCode"
                  placeholder="Ej: SRV-001"
                />
              </div>

              <div class="col-12">
                <label for="serviceDescription" class="form-label">Descripción</label>
                <textarea
                  class="form-control"
                  id="serviceDescription"
                  [(ngModel)]="service.description"
                  name="serviceDescription"
                  rows="3"
                ></textarea>
              </div>

              <div class="col-md-6">
                <label for="serviceTax" class="form-label">Impuesto</label>
                <select
                  class="form-select"
                  id="serviceTax"
                  [(ngModel)]="service.tax_rule_id"
                  name="serviceTax"
                >
                  <option [ngValue]="undefined">Seleccionar impuesto...</option>
                  <option *ngFor="let tax of taxes" [ngValue]="tax.id">
                    {{ tax.name }}
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="serviceUnit" class="form-label">Unidad de Medida</label>
                <select
                  class="form-select"
                  id="serviceUnit"
                  [(ngModel)]="service.unit"
                  name="serviceUnit"
                >
                  <option value="">Seleccionar unidad...</option>
                  <option *ngFor="let unit of units" [value]="unit.id">
                    {{ unit.name }}
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="satUnitCode" class="form-label">Unidad de Medida SAT</label>
                <select
                  class="form-select"
                  id="satUnitCode"
                  [(ngModel)]="service.sat_unit_code"
                  name="satUnitCode"
                >
                  <option value="E48">E48</option>
                </select>
                <small class="form-text text-muted">Única clave disponible</small>
              </div>

              <div class="col-12">
                <label class="form-label">Proveedores asociados</label>
                <ng-select
                  [items]="providersCatalog"
                  bindLabel="name"
                  bindValue="id"
                  [multiple]="true"
                  [(ngModel)]="service.providers"
                  [searchFn]="providerSearchFn"
                  [loading]="loadingProviders"
                  [clearable]="true"
                  placeholder="Selecciona proveedores..."
                  notFoundText="No se encontraron proveedores"
                >
                  <ng-template ng-label-tmp let-item="item">
                    {{ item.name }}
                  </ng-template>
                  <ng-template ng-option-tmp let-item="item">
                    <div class="d-flex flex-column">
                      <span class="fw-bold">{{ item.name }}</span>
                      <small class="text-muted">RFC: {{ item.tax_id || '-' }}</small>
                    </div>
                  </ng-template>
                </ng-select>
                <small class="form-text text-muted">Puedes seleccionar varios proveedores</small>
              </div>

              <div class="col-md-6">
                <label class="form-label d-block">Opciones</label>
                <div class="form-check form-check-inline mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="isPurchasable"
                    [(ngModel)]="service.is_purchasable"
                    name="isPurchasable"
                  />
                  <label class="form-check-label" for="isPurchasable">Se compra</label>
                </div>
                <div class="form-check form-check-inline mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="isBillable"
                    [(ngModel)]="service.is_billable"
                    name="isBillable"
                  />
                  <label class="form-check-label" for="isBillable">Se factura</label>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">Estado</label>
                <div class="form-check form-switch mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="serviceActive"
                    [(ngModel)]="service.is_active"
                    name="serviceActive"
                  />
                  <label class="form-check-label" for="serviceActive">
                    {{ service.is_active ? 'Activo' : 'Inactivo' }}
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
