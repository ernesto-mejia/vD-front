
<div class="navbar-container forced-navbar">
  <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm py-0">
    <div class="container-fluid px-1">
      <button class="navbar-toggler py-1 px-2" type="button"
              (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen"
              aria-controls="navbarNavDropdown"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse"
          [class.collapse]="!isMenuOpen"
          [class.show]="isMenuOpen"
          id="navbarNavDropdown">
        <app-content-menu></app-content-menu>
      </div>
      <!-- Badge de notificaciones -->
      <app-notifications-badge></app-notifications-badge>
    </div>
  </nav>
</div>
